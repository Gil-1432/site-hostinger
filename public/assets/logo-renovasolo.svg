<svg viewBox="0 0 460 120" width="460" height="120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leaf-grad" x1="10" y1="110" x2="60" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#135E35" />
      <stop offset="50%" stop-color="#1E824C" />
      <stop offset="100%" stop-color="#2ECC71" />
    </linearGradient>
    <linearGradient id="tech-grad" x1="60" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0072B5" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#00A3E0" />
    </linearGradient>
  </defs>

  <!-- SÍMBOLO DA GOTA -->
  <g transform="translate(10, 5)">
    <!-- Metade Direita: Gota Tecnológica Azul -->
    <path d="M55 12 C72 35 104 65 104 92 C104 114 82 126 55 126 C55 126 55 102 55 95 C69 95 80 85 80 75 C80 61 66 44 55 30 Z" fill="url(#tech-grad)" />

    <!-- Trilhas de Circuito -->
    <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 45 L64 62 L80 62" />
      <circle cx="80" cy="62" r="2.5" fill="#FFFFFF" />
      <path d="M71 52 L82 64 L82 80 L92 80" />
      <circle cx="92" cy="80" r="2.5" fill="#FFFFFF" />
      <path d="M61 72 L68 72 L68 96 L76 96" />
      <circle cx="76" cy="96" r="2.5" fill="#FFFFFF" />
      <path d="M75 86 L86 86 L86 100" />
      <circle cx="86" cy="100" r="2.5" fill="#FFFFFF" />
      <path d="M67 103 L67 118" />
      <circle cx="67" cy="118" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- Metade Esquerda: Folha e Natureza -->
    <path d="M55 12 C38 35 6 65 6 92 C6 114 28 126 55 126 C55 126 55 102 55 95 C41 95 30 85 30 75 C30 61 44 44 55 30 Z" fill="url(#leaf-grad)" />
    <!-- Folha Superior -->
    <path d="M26 58 C15 51 9 37 12 24 C24 25 33 35 32 49 Z" fill="#1E824C" />
    <!-- Folha Média -->
    <path d="M20 78 C8 75 3 65 5 54 C16 55 24 64 25 74 Z" fill="#135E35" />
    <!-- Haste Solar -->
    <path d="M27 34 L33 16" stroke="#135E35" stroke-width="2.5" stroke-linecap="round" />
    <!-- Painel Solar -->
    <g transform="translate(33, 15) rotate(-18)">
      <rect x="-10" y="-8" width="20" height="16" rx="1.5" fill="#1A382B" stroke="#2ECC71" stroke-width="1.2" />
      <line x1="-10" y1="-2" x2="10" y2="-2" stroke="#8CCFD0" stroke-width="0.8" />
      <line x1="-10" y1="3" x2="10" y2="3" stroke="#8CCFD0" stroke-width="0.8" />
      <line x1="-3" y1="-8" x2="-3" y2="8" stroke="#8CCFD0" stroke-width="0.8" />
      <line x1="4" y1="-8" x2="4" y2="8" stroke="#8CCFD0" stroke-width="0.8" />
    </g>
    <!-- Gota Negativa Central -->
    <path d="M55 34 C63 48 72 63 72 75 C72 85 64 92 55 92 C46 92 38 85 38 75 C38 63 47 48 55 34 Z" fill="#FFFFFF" />
  </g>

  <!-- TIPOGRAFIA DA MARCA -->
  <text x="140" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#135E35" letter-spacing="-0.5">RENOVASOLO</text>
  <text x="142" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0284C7" letter-spacing="8">CLIMATECH</text>
</svg>
