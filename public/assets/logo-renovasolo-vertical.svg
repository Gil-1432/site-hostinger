    <path d="M38 85 C22 75 14 55 18 36 C35 38 48 52 46 72 Z" fill="#1E824C" />
    <path d="M20 40 C28 55 38 70 42 78" stroke="#2ECC71" stroke-width="2" stroke-linecap="round" />
