<svg viewBox="0 0 400 440" width="400" height="440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leaf-grad-vert" x1="15" y1="180" x2="80" y2="15" gradientUnits="userSpaceOnUse">
