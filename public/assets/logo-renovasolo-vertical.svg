  <!-- TIPOGRAFIA OFICIAL -->
  <text x="200" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#145A32" letter-spacing="-0.5">RENOVASOLO</text>
  <text x="200" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" fill="#0284C7" letter-spacing="9">CLIMATECH</text>

