      <line x1="-14" y1="-3" x2="14" y2="-3" stroke="#8CCFD0" stroke-width="1.1" />
      <line x1="-14" y1="4" x2="14" y2="4" stroke="#8CCFD0" stroke-width="1.1" />
      <line x1="-5" y1="-11" x2="-5" y2="11" stroke="#8CCFD0" stroke-width="1.1" />
      <line x1="5" y1="-11" x2="5" y2="11" stroke="#8CCFD0" stroke-width="1.1" />
    </g>

    <!-- Gota Negativa Central -->
    <path d="M80 50 C92 70 105 92 105 110 C105 125 94 135 80 135 C66 135 55 125 55 110 C55 92 68 70 80 50 Z" fill="#FFFFFF" />
